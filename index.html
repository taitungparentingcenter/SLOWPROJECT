<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台東活動</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 溫暖、清楚,像社區布告欄,家長一眼就懂
   IDEA: 台東公車路線圖 — 從市區出發的三條線,每一站就是一個鄉鎮
   PICTURE: 可點選的路線圖,點線或站名即切換區域與鄉鎮
   COLOUR and TYPE: 太平洋藍(海線)、稻田綠(縱谷)、陽光橘(南迴)、市區紅;Noto Sans TC
   LAYOUT: 寬螢幕左圖右清單;手機依序為標題、路線圖、分區按鈕、活動 */
:root{color-scheme:light dark;
--bg:light-dark(#fffdf8,#10161c);--card:light-dark(#ffffff,#18212a);--ink:light-dark(#1d232a,#eef1f4);
--mute:light-dark(#5d6670,#9aa6b2);--line:light-dark(#e6e1d6,#2a3540);
--city:light-dark(#d2452f,#ff7a63);--coast:light-dark(#0b6aa6,#4fb0ec);--valley:light-dark(#2f8a3e,#6cc77a);--south:light-dark(#d9820f,#ffb347)}
:root{--sky1:light-dark(#cfe8f6,#0c1a2c);--sky2:light-dark(#fff4dc,#18283c);--sun:light-dark(#ffb547,#f2c14e);--mtn1:light-dark(#a9cfb0,#22403a);--mtn2:light-dark(#649f72,#1a3829);--field:light-dark(#ecd879,#4b4420);--sea:light-dark(#2a7fbd,#1b4d78)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2));padding:clamp(28px,5vw,56px) max(5vw,16px) clamp(130px,20vw,240px)}
.scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:clamp(160px,24vw,300px)}
.nb{display:inline-block}
.hero-in{position:relative;max-width:1240px;margin:auto}
h1{font-size:clamp(32px,5vw,48px);line-height:1.1;margin:0 0 8px;font-weight:900;text-wrap:balance}
.lead{margin:0;color:var(--ink);opacity:.8;max-width:40em;font-size:17px}
main{max-width:1240px;margin:auto;padding:24px max(5vw,16px) 40px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,4vw,48px);align-items:start}
.mapbox{position:sticky;top:16px;background:radial-gradient(circle at 105% 60%,color-mix(in srgb,var(--coast) 16%,var(--card)) 0,var(--card) 48%);border:1px solid var(--line);border-radius:20px;padding:12px}
.mapbox svg{width:100%;height:auto;display:block;max-height:78vh}
.mapnote{font-size:13px;color:var(--mute);margin:4px 8px 4px}
.rt{cursor:pointer;transition:opacity .25s}
.rt.off{opacity:.28}
.rt path{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.rt .st{fill:var(--card);stroke-width:4}
.rt .st.sel{stroke-width:7}
.rt text{font-size:14px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:4px}
.hub{cursor:pointer}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.tab{font:inherit;font-weight:700;font-size:16px;min-height:52px;border-radius:14px;border:2px solid var(--c);background:var(--card);color:var(--ink);cursor:pointer;padding:6px 4px;line-height:1.2}
.tab small{display:block;font-weight:500;font-size:13px;color:var(--mute)}
.tab[aria-selected=true]{background:var(--c);color:#fff}
.tab[aria-selected=true] small{color:#fff;opacity:.9}
.tab:focus-visible,.chip:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.towns,.ages{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font:inherit;font-size:15px;min-height:44px;padding:4px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--card));font-weight:700}
.lbl{font-size:13px;color:var(--mute);margin:0 0 4px}
.sum{margin:14px 0 12px;font-weight:700;font-size:18px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--sel,var(--city)) 13%,var(--card))}
.list{display:grid;gap:12px}
.ev{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.d{text-align:center;align-self:start;padding:10px 4px;border-radius:12px;background:color-mix(in srgb,var(--c) 11%,var(--card))}
.d b{display:block;font-size:26px;line-height:1.1;color:var(--c);white-space:nowrap}
.d span{font-size:14px;color:var(--mute)}
.ev h3{margin:0 0 4px;font-size:18px;line-height:1.35}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:15px;color:var(--mute)}
.meta span{white-space:nowrap}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:1px 10px;border-radius:999px;margin-bottom:6px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--ink)}
.tag.now{background:var(--c);color:#fff}
.ev p{margin:6px 0 0;font-size:15px}
.ev a{color:var(--c);font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tags .tag{margin:0}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:1px 10px;border-radius:999px;white-space:nowrap;max-width:100%}
.pill.fee{white-space:normal;border-radius:12px;line-height:1.5}
.pill.age{background:light-dark(#e8f1fb,#1d3448);color:light-dark(#0b4f7c,#9fd0f5);border:1px solid light-dark(#b9d6f0,#2e5675)}
.pill.svc{background:light-dark(#f4eefb,#2e2440);color:light-dark(#5b3a8c,#d4bdf5);border:1px solid light-dark(#dccbf1,#4a3a66)}
.pill.fee{background:light-dark(#eaf6ec,#1d3a24);color:light-dark(#21692e,#9be0a8);border:1px solid light-dark(#bfe3c6,#2f5d39)}
.info{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px;font-size:15px}
.info li{display:grid;grid-template-columns:3em minmax(0,1fr);gap:8px}
.info .k{color:var(--mute)}
.go{display:inline-flex;align-items:center;min-height:44px;margin-top:10px;padding:6px 16px;border-radius:12px;background:var(--c);color:#fff!important;text-decoration:none;font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.btns .go{margin-top:0}
.go.web{background:transparent;color:var(--c)!important;border:2px solid var(--c)}
.go:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.ev.past{opacity:.55}
.empty{padding:28px;text-align:center;border:2px dashed var(--line);border-radius:16px;color:var(--mute)}
.more{font:inherit;margin-top:16px;min-height:44px;padding:6px 16px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.more-svc{padding:0 max(5vw,16px) 44px}
.ms-in{max-width:1240px;margin:auto}
.more-svc h2{font-size:24px;margin:0 0 12px;font-weight:900}
.ms-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ms-l{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;border:2px solid var(--c);background:var(--card);color:var(--ink);text-decoration:none}
.ms-l svg{width:44px;height:44px;flex:none}
.ms-l span{flex:1;display:flex;flex-direction:column;gap:2px}
.ms-l b{font-size:18px;line-height:1.3}.ms-l small{font-size:14px;color:var(--mute);line-height:1.45}
.ms-l em{font-style:normal;font-weight:700;color:var(--c);white-space:nowrap}
.ms-l.ln{background:var(--c);color:#fff}.ms-l.ln small,.ms-l.ln em{color:#fff}.ms-l.ln small{opacity:.92}
.ms-l:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media(max-width:960px){.ms-grid{grid-template-columns:minmax(0,1fr)}}
.foot{position:relative;background:var(--sea);color:#fff;text-align:center;padding:12px 16px 36px;margin-top:32px}
.foot .wave{position:absolute;left:0;top:-39px;width:100%;height:40px}
.foot .note{margin:0;font-size:clamp(18px,2.4vw,22px);font-weight:700}
.foot .small{margin:6px 0 0;font-size:15px;opacity:.9}
@media(max-width:860px){main{grid-template-columns:minmax(0,1fr)}.mapbox{position:static}.mapbox svg{max-height:420px;margin:auto}}
@media(max-width:600px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.ev{grid-template-columns:66px minmax(0,1fr);gap:10px;padding:12px}.d b{font-size:21px}}
@media(prefers-reduced-motion:reduce){.rt{transition:none}}
</style>
</head>
<body>
<header class="hero">
<svg class="scene" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
<circle cx="1010" cy="112" r="62" fill="var(--sun)" opacity=".22"/><circle cx="1010" cy="112" r="38" fill="var(--sun)"/>
<path d="M0 205L80 132L150 170L245 104L335 158L430 112L540 172L620 136L705 182L810 240V300H0Z" fill="var(--mtn1)"/>
<g transform="translate(560 118)"><path d="M0 -30C-20 -30 -28 -14 -26 -2C-24 10 -10 20 -6 30H6C10 20 24 10 26 -2C28 -14 20 -30 0 -30Z" fill="var(--city)"/><path d="M0 -30C-8 -18 -9 12 -4 30H4C9 12 8 -18 0 -30Z" fill="var(--south)"/><path d="M-6 30L-5 38M6 30L5 38" stroke="var(--ink)" stroke-width="1.2" opacity=".6"/><rect x="-6" y="38" width="12" height="9" rx="2" fill="#8a5a3c"/></g>
<g transform="translate(670 96) scale(.62)"><path d="M0 -30C-20 -30 -28 -14 -26 -2C-24 10 -10 20 -6 30H6C10 20 24 10 26 -2C28 -14 20 -30 0 -30Z" fill="var(--south)"/><path d="M0 -30C-8 -18 -9 12 -4 30H4C9 12 8 -18 0 -30Z" fill="var(--valley)"/><rect x="-6" y="34" width="12" height="9" rx="2" fill="#8a5a3c"/></g>
<path d="M0 238Q110 178 230 222T470 214T700 226L800 244V300H0Z" fill="var(--mtn2)"/>
<path d="M0 262H790V300H0Z" fill="var(--field)"/>
<path d="M0 272H790M0 282H790M0 292H790" stroke="var(--mtn2)" stroke-width="1.5" opacity=".35"/>
<path d="M0 262H790" stroke="var(--ink)" stroke-width="2" opacity=".35"/>
<g transform="translate(430 246)"><rect width="38" height="15" rx="4" fill="var(--city)"/><rect x="41" width="38" height="15" rx="4" fill="var(--city)"/><rect x="82" width="38" height="15" rx="4" fill="var(--city)"/><path d="M6 4h8v5H6zM22 4h8v5h-8zM47 4h8v5h-8zM63 4h8v5h-8zM88 4h8v5h-8zM104 4h8v5h-8z" fill="var(--sky2)"/></g>
<path d="M745 236Q900 214 1200 218V300H720Z" fill="var(--sea)"/>
<ellipse cx="1102" cy="219" rx="44" ry="8" fill="var(--mtn2)"/>
<path d="M800 252q15-6 30 0t30 0M900 268q15-6 30 0t30 0M1010 248q15-6 30 0t30 0M1080 276q15-6 30 0t30 0M850 286q15-6 30 0t30 0" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".55"/>
</svg>
<div class="hero-in">
<h1><span class="nb">台東活動，</span><span class="nb">從你家附近找起</span></h1>
<p class="lead">選擇你想要去的區域，活動會依日期由近到遠排好。點路線圖上的鄉鎮，就能看到該地區的活動。</p>

<main>
<section class="mapbox" aria-label="台東分區路線圖">
<svg id="map" viewBox="0 0 360 470" role="img" aria-label="台東四區路線圖"></svg>
<p class="mapnote">點選路線或站名切換區域與鄉鎮；再點一次同一站（或同一個鄉鎮按鈕）即可取消鄉鎮篩選。</p>

<section>

<a class="ms-l ln" style="--c:#06c755" href="https://lin.ee/zpl0WwJ" target="_blank" rel="noopener"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 7C13 7 5 14 5 22.5c0 7.6 6.6 13.9 15.6 15.1.6.1 1.4.4 1.6 1 .2.5.1 1.3 0 1.8l-.3 1.6c-.1.5-.4 1.8 1.6 1 2-.8 10.8-6.4 14.8-10.9C41.1 29.4 43 26.1 43 22.5 43 14 34.5 7 24 7Z" fill="#fff"/></svg><span><b>加入官方 LINE</b><small>臺東縣居家賦能計畫，直接詢問、收最新消息</small></span><em>加入 ›</em></a>
</div>

</section>

<script>
{
/* ===== 設定:把 Google 試算表「發布到網路」的 CSV 網址貼在下面引號中 ===== */
const SHEET_CSV_URL='https://docs.google.com/spreadsheets/d/16BuXmZVFoRRqOdm0-q0Jo-yUXdLoMcRJhfPekoLqcoM/gviz/tq?tqx=out:csv&sheet=%E6%B4%BB%E5%8B%95';

let EVENTS=[],LOAD='loading';
const RN={'市區':'city','海線':'coast','縱谷線':'valley','縱谷':'valley','南迴線':'south','南迴':'south'};
const KEYS={'區域':'region','鄉鎮':'town','活動名稱':'title','開始日期':'start','結束日期':'end','時間':'time','地點':'place','最小年齡':'amin','最大年齡':'amax','費用':'fee','報名方式':'signup','聯絡窗口':'contact','報名連結':'link','服務項目':'svc','官網連結':'web'};
const fw=v=>String(v==null?'':v).replace(/,/g,'，').replace(/;/g,'；').replace(/\(/g,'（').replace(/\)/g,'）').replace(/\?/g,'？').replace(/!/g,'！').replace(/(\D|^):(?!\d)/g,'$1：').replace(/(\D):/g,'$1：');
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseCSV(t){const rows=[];let row=[],f='',q=false;
for(let i=0;i<t.length;i++){const c=t[i];
if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}
if(f||row.length){row.push(f);rows.push(row)}return rows}
function normDate(v){const m=String(v||'').trim().replace(/[年月\/.]/g,'-').replace('日','').match(/^(\d{2,4})-(\d{1,2})-(\d{1,2})/);
if(!m)return '';let y=+m[1];if(y<1911)y+=1911;return `${y}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`}
function normTown(v){let t=String(v||'').trim().replace(/臺/g,'台');if(t==='台東'||t==='台東市')return '台東市';return t.replace(/[鄉鎮市]$/,'')}
const BLOCK=/^https?:\/\/([a-z0-9-]+\.)*(facebook\.com|fb\.com|fb\.me|fb\.watch|reurl\.cc)(\/|$)/i;
const isSignup=u=>/^https?:\/\/([a-z0-9-]+\.)*(forms\.gle|docs\.google\.com\/forms|forms\.google\.com|beclass\.com|accupass\.com|kktix\.cc|kktix\.com|eventbrite\.[a-z.]+|surveycake\.com|cakeresume\.com|tixcraft\.com|opentix\.life|ibon\.com\.tw|event\.culture\.tw|lu\.ma|luma\.com)(\/|$)/i.test(u)||/(signup|register|registration|報名)/i.test((()=>{try{return decodeURIComponent(u)}catch(e){return u}})());
const isForm=u=>/^https:\/\/(forms\.gle\/|docs\.google\.com\/forms\/|forms\.google\.com\/)/i.test(u);
function cleanLink(u){u=String(u||'').trim();if(!/^https?:\/\//i.test(u)||BLOCK.test(u))return '';
return u.replace(/[?&](fbclid|igshid)=[^&#]*/gi,'').replace(/^([^?]*)&/,'$1?')}
function toEvents(rows){const h=(rows.shift()||[]).map(x=>KEYS[x.trim()]);const out=[];
rows.forEach(r=>{const o={};h.forEach((k,i)=>{if(k)o[k]=(r[i]||'').trim()});
o.start=normDate(o.start);o.end=normDate(o.end);if(!o.title||!o.start)return;
o.town=normTown(o.town);let rg=RN[o.region];
if(!rg)for(const k in R)if(R[k].towns.includes(o.town))rg=k;if(!rg)return;
o.region=rg;if(o.end&&o.end<o.start)o.end='';
const a0=parseInt(o.amin),a1=parseInt(o.amax);o.age=[isNaN(a0)?0:a0,isNaN(a1)?99:a1];
['title','town','place','fee','signup','contact','svc','time'].forEach(k=>{if(o[k])o[k]=fw(o[k])});o.svc=o.svc||'';o.time=o.time||'';o.place=o.place||'';o.fee=o.fee||'請洽主辦單位';o.signup=o.signup||'';o.contact=o.contact||'';
o.link=cleanLink(o.link);o.web=cleanLink(o.web);if(o.link&&!isSignup(o.link)){if(!o.web)o.web=o.link;o.link=''}out.push(o)});return out}

const R={
city:{name:'市區',sub:'台東市',c:'--city',towns:['台東市']},
coast:{name:'海線',sub:'東河・成功・長濱',c:'--coast',towns:['東河','成功','長濱']},
valley:{name:'縱谷線',sub:'卑南至池上',c:'--valley',towns:['卑南','鹿野','延平','關山','海端','池上']},
south:{name:'南迴線',sub:'太麻里至達仁',c:'--south',towns:['太麻里','金峰','大武','達仁']}
};
const AGES=[['全部',null],['0–3 歲',[0,3]],['3–6 歲',[3,6]],['6 歲以上',[6,99]]];
const WD='日一二三四五六';
const DAY=864e5;
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const t0=new Date();const today=new Date(t0.getFullYear(),t0.getMonth(),t0.getDate());
const md=d=>`${d.getMonth()+1}/${d.getDate()}`;

let st={region:'city',town:null,age:0,svc:null,past:false};
try{const h=location.hash.slice(1);if(R[h])st.region=h}catch(e){}

/* ---- 路線圖 ---- */
const hub=[190,300];
const LINES={
coast:{pts:[[250,232,'東河','r'],[283,148,'成功','r'],[312,52,'長濱','l']]},
valley:{pts:[[160,250,'卑南','l'],[150,196,'鹿野','r'],[150,128,'關山','r'],[150,52,'池上','r']],spur:[[[150,196],[86,190,'延平','l']],[[150,128],[86,112,'海端','l']]]},
south:{pts:[[178,362,'太麻里','r'],[148,412,'大武','r'],[112,450,'達仁','r']],spur:[[[178,362],[112,350,'金峰','l']]]}
};
const map=document.getElementById('map');
const lab=(x,y,t,s)=>`<text x="${s==='l'?x-12:x+12}" y="${y+5}" text-anchor="${s==='l'?'end':'start'}">${t}</text>`;
function drawMap(){
let h='';
for(const k in LINES){const L=LINES[k],c=`var(${R[k].c})`;
const path='M'+hub.join(' ')+L.pts.map(p=>' L'+p[0]+' '+p[1]).join('');
let g=`<path d="${path}" stroke="${c}"/>`;
(L.spur||[]).forEach(([a,b])=>{g+=`<path d="M${a[0]} ${a[1]} L${b[0]} ${b[1]}" stroke="${c}" stroke-width="6"/>`});
const all=L.pts.concat((L.spur||[]).map(s=>s[1]));
all.forEach(p=>{g+=`<g data-town="${p[2]}"><circle cx="${p[0]}" cy="${p[1]}" r="18" fill="transparent" stroke="none"/><circle class="st${st.town===p[2]?' sel':''}" cx="${p[0]}" cy="${p[1]}" r="8" stroke="${c}"/>${lab(p[0],p[1],p[2],p[3])}</g>`});
h+=`<g class="rt${st.region===k?'':' off'}" data-r="${k}">${g}</g>`}
h+=`<g class="rt hub${st.region==='city'?'':' off'}" data-r="city"><g data-town="台東市"><circle cx="${hub[0]}" cy="${hub[1]}" r="20" fill="var(--city)"/><circle cx="${hub[0]}" cy="${hub[1]}" r="9" fill="var(--card)"/><text x="${hub[0]+28}" y="${hub[1]+6}" style="font-size:17px">台東市區</text></g></g>`;
h+=`<text x="330" y="300" text-anchor="end" style="font-size:13px;fill:var(--mute);font-weight:500">太平洋</text>`;
map.innerHTML=h}
map.addEventListener('click',e=>{const g=e.target.closest('[data-r]');if(!g)return;const t=e.target.closest('[data-town]');
const r=g.dataset.r;const town=t?t.dataset.town:null;
if(r!==st.region){st.region=r;st.town=r==='city'?null:town}else{st.town=(town&&st.town!==town&&r!=='city')?town:null}
render()});

/* ---- 控制項 ---- */
const tabs=document.getElementById('tabs'),towns=document.getElementById('towns'),ages=document.getElementById('ages'),svcs=document.getElementById('svcs');
const upcoming=e=>pd(e.end||e.start)>=today;
function drawControls(){
tabs.innerHTML=Object.keys(R).map(k=>{const n=EVENTS.filter(e=>e.region===k&&upcoming(e)).length;
return `<button class="tab" role="tab" id="tab-${k}" data-r="${k}" style="--c:var(${R[k].c})" aria-selected="${st.region===k}">${R[k].name}<small>${n} 場活動</small></button>`}).join('');
const c=`var(${R[st.region].c})`;
const tw=R[st.region].towns;
towns.innerHTML=tw.length>1?[`<button class="chip" style="--c:${c}" data-t="" aria-pressed="${!st.town}">全部鄉鎮</button>`].concat(tw.map(t=>`<button class="chip" style="--c:${c}" data-t="${t}" aria-pressed="${st.town===t}">${t}</button>`)).join(''):`<span class="chip" style="--c:${c};cursor:default" aria-pressed="true">台東市</span>`;
ages.innerHTML=AGES.map((a,i)=>`<button class="chip" style="--c:${c}" data-a="${i}" aria-pressed="${st.age===i}">${a[0]}</button>`).join('');
const list=[...new Set(EVENTS.filter(e=>e.region===st.region&&(!st.town||e.town===st.town)&&e.svc&&(upcoming(e)||st.past)).map(e=>e.svc))];
if(st.svc&&!list.includes(st.svc))st.svc=null;
document.getElementById('svcLbl').style.display=svcs.style.display=list.length?'':'none';
svcs.innerHTML=[`<button class="chip" style="--c:${c}" data-s="" aria-pressed="${!st.svc}">全部</button>`].concat(list.map(v=>`<button class="chip" style="--c:${c}" data-s="${esc(v)}" aria-pressed="${st.svc===v}">${esc(v)}</button>`)).join('')}
tabs.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;st.region=b.dataset.r;st.town=null;render()});
towns.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;const t=b.dataset.t||null;st.town=(t&&st.town===t)?null:t;render()});
ages.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;st.age=+b.dataset.a;render()});
svcs.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;const v=b.dataset.s||null;st.svc=(v&&st.svc===v)?null:v;render()});
document.getElementById('pastBtn').addEventListener('click',()=>{st.past=!st.past;render()});

/* ---- 活動清單 ---- */
function status(e){const s=pd(e.start),en=pd(e.end||e.start);
if(s<=today&&en>=today)return['進行中',true];
const n=Math.round((s-today)/DAY);
if(n===1)return['明天',true];if(n<=7)return[`${n} 天後`,true];
if(n<=31)return[`還有 ${n} 天`,false];return[`${s.getMonth()+1} 月`,false]}
function card(e,past){const s=pd(e.start),en=e.end?pd(e.end):null;
const [lbl,hot]=past?['已結束',false]:status(e);
const dt=en?`${md(s)}<span style="display:block;font-size:.6em">至 ${md(en)}</span>`:md(s);
const wd=en?'':`週${WD[s.getDay()]}`;
const age=e.age[1]>=99&&e.age[0]===0?'不限年齡':e.age[1]>=99?`${e.age[0]} 歲以上`:`${e.age[0]}–${e.age[1]} 歲`;
const row=(k,v)=>v?`<li><span class="k">${k}</span><span class="v">${v}</span></li>`:'';
return `<article class="ev${past?' past':''}" style="--c:var(${R[e.region].c})">
<div class="d"><b>${dt}</b><span>${wd}</span></div>
<div><div class="tags"><span class="tag${hot?' now':''}">${lbl}</span><span class="pill age">適合 ${age}</span><span class="pill fee">${esc(e.fee)}</span></div>
<h3>${esc(e.title)}</h3>
<ul class="info">${row('項目',esc(e.svc))}${row('時間',esc(e.time))}${row('地點',esc(e.town)+(e.place?'・'+esc(e.place):''))}${row('報名',esc(e.signup))}${row('聯絡',esc(e.contact))}</ul>
${(e.link||e.web)?`<div class="btns">${e.link?`<a class="go" href="${esc(e.link)}" target="_blank" rel="noopener">前往報名</a>`:''}${e.web?`<a class="go web" href="${esc(e.web)}" target="_blank" rel="noopener">活動網站</a>`:''}</div>`:''}</div></article>`}
function render(){
try{history.replaceState(null,'','#'+st.region)}catch(e){}
document.documentElement.style.setProperty('--sel',`var(${R[st.region].c})`);
drawMap();drawControls();
const a=AGES[st.age][1];
const pool=EVENTS.filter(e=>e.region===st.region&&(!st.town||e.town===st.town)&&(!st.svc||e.svc===st.svc)&&(!a||(e.age[0]<a[1]&&(e.age[1]>a[0]||e.age[0]>=a[0]))));
const up=pool.filter(upcoming).sort((x,y)=>pd(x.start)-pd(y.start)||x.time.localeCompare(y.time));
const past=pool.filter(e=>!upcoming(e)).sort((x,y)=>pd(y.start)-pd(x.start));
const where=st.town||R[st.region].name;
const msg={loading:'活動載入中…',err:'活動資料暫時無法載入，請稍後重新整理',nourl:'尚未設定試算表網址'}[LOAD];
document.getElementById('sum').textContent=msg?msg:up.length?`${where}接下來有 ${up.length} 場活動`:`${where}目前沒有即將舉辦的活動`;
let h=LOAD!=='ok'?'':up.map(e=>card(e,false)).join('')||`<div class="empty">這裡暫時沒有活動，可以看看其他鄉鎮或換個年齡條件。</div>`;
if(st.past&&past.length)h+=past.map(e=>card(e,true)).join('');
document.getElementById('list').innerHTML=h;
const pb=document.getElementById('pastBtn');
pb.style.display=past.length?'':'none';
pb.textContent=st.past?'隱藏已結束的活動':`顯示已結束的活動（${past.length}）`}
function load(){
if(!/^https?:/.test(SHEET_CSV_URL)){LOAD='nourl';render();return}
fetch(SHEET_CSV_URL+(SHEET_CSV_URL.includes('?')?'&':'?')+'_='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.text()})
.then(t=>{EVENTS=toEvents(parseCSV(t.replace(/^\ufeff/,'')));LOAD='ok';render()})
.catch(()=>{LOAD='err';render()})}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(R[h]&&h!==st.region){st.region=h;st.town=null;render()}});
render();load();
}
</script>
</body>
</html>
